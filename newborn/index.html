<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newborn | Tabata Fotografia</title>
<meta name="description" content="Galeria de Newborn da Tabata Fotografia.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--marrom:#684936;--escuro:#35251D;--nude:#EAD8C8}
*{box-sizing:border-box}body{margin:0;background:#FBF8F4;color:var(--escuro);font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}header{background:white;padding:22px max(6%,20px);display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 2px 15px #00000010}
.logo{font-family:'Playfair Display',serif;color:var(--marrom);font-size:25px}.voltar{font-weight:600;font-size:14px;color:var(--marrom)}
main{max-width:1320px;margin:auto;padding:65px 6% 85px}.intro{text-align:center;max-width:650px;margin:0 auto 45px}
.eyebrow{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#A67C61;font-weight:700}
h1{font:500 clamp(38px,5vw,62px) 'Playfair Display',serif;margin:12px 0}
.intro p{line-height:1.8;color:#806E62}
.fotos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.foto-galeria{border:0;background:#EAD8C8;padding:0;height:390px;overflow:hidden;cursor:pointer}
.foto-galeria img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.foto-galeria:hover img{transform:scale(1.04)}
.cta{text-align:center;margin:55px auto 0}.botao{display:inline-block;background:var(--marrom);color:white;padding:16px 26px;border-radius:4px;font-weight:600}
footer{text-align:center;background:#241914;color:#EAD8C8;padding:35px 15px;font-size:13px}
.lightbox{position:fixed;inset:0;z-index:999;background:#170f0cf2;display:none;align-items:center;justify-content:center;padding:25px}
.lightbox.aberto{display:flex}.lightbox img{max-width:min(100%,1100px);max-height:85vh;object-fit:contain}
.lightbox-fechar{position:absolute;right:22px;top:15px;border:0;background:none;color:white;font-size:40px;cursor:pointer}
@media(max-width:800px){.fotos-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foto-galeria{height:320px}}
@media(max-width:500px){header{flex-wrap:wrap}main{padding:45px 5%}.fotos-grid{gap:9px}.foto-galeria{height:235px}}
</style></head>
<body><header><a class="logo" href="../">Tabata Fotografia</a><a class="voltar" href="../#portfolio">← Voltar ao portfólio</a></header>
<main><div class="intro"><div class="eyebrow">Nosso portfólio</div><h1>Newborn</h1><p>Os primeiros dias, os pequenos detalhes e o início de uma linda história.</p></div>
<div class="fotos-grid"><button class="foto-galeria" type="button" onclick="abrirFoto(this.querySelector('img').src)" aria-label="Ampliar foto 1 de Newborn"><img src="../imagens/newborn-01.jpg" alt="Foto 1 do ensaio Newborn" loading="lazy"></button>
<button class="foto-galeria" type="button" onclick="abrirFoto(this.querySelector('img').src)" aria-label="Ampliar foto 2 de Newborn"><img src="../imagens/newborn-02.jpg" alt="Foto 2 do ensaio Newborn" loading="lazy"></button>
<button class="foto-galeria" type="button" onclick="abrirFoto(this.querySelector('img').src)" aria-label="Ampliar foto 3 de Newborn"><img src="../imagens/newborn-03.jpg" alt="Foto 3 do ensaio Newborn" loading="lazy"></button>
<button class="foto-galeria" type="button" onclick="abrirFoto(this.querySelector('img').src)" aria-label="Ampliar foto 4 de Newborn"><img src="../imagens/newborn-04.jpg" alt="Foto 4 do ensaio Newborn" loading="lazy"></button></div>
<div class="cta"><a class="botao" href="https://wa.me/5519993121204?text=Ol%C3%A1%2C%20Tabata%21%20Gostaria%20de%20saber%20mais%20sobre%20o%20ensaio%20newborn.">Solicitar orçamento</a></div></main>
<footer>© <span id="ano"></span> Tabata Fotografia · Todos os direitos reservados.</footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" onclick="fecharFoto(event)"><button class="lightbox-fechar" type="button" aria-label="Fechar" onclick="fecharFoto(event)">×</button><img id="fotoAmpliada" src="" alt="Fotografia ampliada"></div>
<script>
document.getElementById('ano').textContent=new Date().getFullYear();
function abrirFoto(src){document.getElementById('fotoAmpliada').src=src;document.getElementById('lightbox').classList.add('aberto');document.body.style.overflow='hidden'}
function fecharFoto(e){if(e.target.id==='lightbox'||e.target.classList.contains('lightbox-fechar'))fechar()}
function fechar(){document.getElementById('lightbox').classList.remove('aberto');document.getElementById('fotoAmpliada').src='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()})
</script></body></html>
