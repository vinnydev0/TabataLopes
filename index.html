<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabata Fotografia • Studio</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#252b35;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:#20252e;color:#c7ced8;padding:28px 15px;flex-shrink:0}.brand{padding:8px 13px 34px;color:#fff;font-size:20px;font-weight:700;letter-spacing:-.7px}.brand span{display:block;color:#a6b1c1;font-size:11px;font-weight:500;letter-spacing:2px;margin-top:5px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#c7ced8;text-align:left;padding:13px 16px;border-radius:11px}.nav button.active,.nav button:hover{background:#343c49;color:#fff}.sidebar small{display:block;margin:38px 15px;color:#8693a4}.main{flex:1;min-width:0}.top{height:76px;background:white;border-bottom:1px solid #eceef1;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.top strong{font-size:15px}.pill{background:#f0f4fa;padding:9px 14px;border-radius:50px;color:#5b6878;font-size:12px}.content{padding:32px 35px;max-width:1450px;margin:auto}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#8290a2;font-weight:700}.heading h1{font-size:29px;letter-spacing:-1.1px;margin:7px 0}.muted{color:#8792a0}.btn{border:0;background:#3e64d9;color:white;border-radius:10px;padding:12px 18px;font-weight:650}.btn.secondary{background:white;color:#3c4654;border:1px solid #dce1e8}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e9edf1;border-radius:16px;padding:23px;box-shadow:0 4px 22px #25304006}.metric{font-size:29px;font-weight:750;margin:12px 0 5px}.label{font-size:13px;color:#8591a0}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;margin-top:20px}.section-title{font-size:17px;font-weight:750;margin:0 0 18px}.empty{padding:40px 10px;text-align:center;color:#8792a0;border:1px dashed #d8dee7;border-radius:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.row strong{display:block;font-size:14px}.row small{display:block;color:#8792a0;margin-top:5px}.tag{background:#edf3ff;color:#4c68aa;border-radius:20px;padding:6px 10px;font-size:11px}.form{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.form input,.form select,.form textarea{background:white;border:1px solid #dfe5ec;padding:12px;border-radius:9px;min-width:170px;flex:1}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.gallery{overflow:hidden;padding:0}.gallery-cover{height:160px;background:linear-gradient(130deg,#ccd6e3,#edf0f4);display:flex;align-items:center;justify-content:center;color:#8a98ab;font-size:42px}.gallery-info{padding:20px}.gallery-info h3{margin:0 0 7px}.gallery-info p{font-size:13px;color:#8591a0}.link{border:0;background:none;color:#3e64d9;padding:0;font-weight:650}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.photo{position:relative;aspect-ratio:1;background:#e9eef5;border-radius:10px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;top:8px;right:8px;background:#fff;border:0;border-radius:8px;padding:6px}.album-work{display:grid;grid-template-columns:230px 1fr;gap:20px}.album-page{background:white;min-height:370px;aspect-ratio:2/1;box-shadow:0 10px 40px #15223820;border:1px solid #d6dce5;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.album-half{border-right:1px dashed #c7cfda;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.album-half:last-child{border:0}.album-slot{border:1px dashed #cbd2de;background:#f7f9fc;display:flex;align-items:center;justify-content:center;color:#a0aab9;font-size:12px;overflow:hidden;cursor:pointer}.album-slot img{width:100%;height:100%;object-fit:cover}.preview{background:#fff;border:1px solid #e8ecf1;border-radius:18px;overflow:hidden}.hero{padding:90px 30px;text-align:center;background:linear-gradient(135deg,#dce3eb,#f5f7f9)}.hero h2{font-size:42px;letter-spacing:-2px;margin:10px 0}.site-menu{padding:20px 28px;display:flex;justify-content:space-between;align-items:center}.site-menu span{font-size:13px;color:#798697}.site-foot{padding:35px;text-align:center;color:#8792a0}.notice{background:#edf3ff;border:1px solid #d9e5ff;padding:13px 16px;border-radius:10px;color:#47618f;font-size:13px;margin-bottom:22px}.hide{display:none!important}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.gallery-grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.sidebar{width:auto;padding:12px}.brand{padding:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidebar small{display:none}.top{height:58px;padding:0 18px}.content{padding:22px 16px}.grid,.gallery-grid{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.album-work{grid-template-columns:1fr}.album-page{min-height:200px}.photo-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">tabata<span>FOTOGRAFIA · STUDIO</span></div><nav class="nav" id="nav"></nav><small>Protótipo local • v0.1</small></aside><main class="main"><header class="top"><strong id="topTitle">Visão geral</strong><span class="pill">✦ Painel do estúdio</span></header><div class="content" id="content"></div></main></div><script>
const menus=[['dashboard','◫','Dashboard'],['site','◈','Meu site'],['galerias','▧','Galerias'],['albuns','▤','Diagramador'],['clientes','♙','Clientes / CRM'],['agenda','▦','Agenda'],['financeiro','＄','Financeiro']];let page='dashboard',currentGallery=null,albumSlots=4;const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let clients=load('tf_clients',[]),galleries=load('tf_galleries',[]),events=load('tf_events',[]),transactions=load('tf_transactions',[]),photos={};const save=()=>{localStorage.setItem('tf_clients',JSON.stringify(clients));localStorage.setItem('tf_galleries',JSON.stringify(galleries));localStorage.setItem('tf_events',JSON.stringify(events));localStorage.setItem('tf_transactions',JSON.stringify(transactions))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function head(title,desc,action=''){return `<div class="heading"><div><div class="eyebrow">TABATA FOTOGRAFIA</div><h1>${title}</h1><span class="muted">${desc}</span></div>${action}</div>`}function setPage(p){page=p;currentGallery=null;render()}function render(){document.getElementById('nav').innerHTML=menus.map(([id,ico,label])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')">${ico} &nbsp; ${label}</button>`).join('');document.getElementById('topTitle').textContent=menus.find(x=>x[0]===page)[2];document.getElementById('content').innerHTML=({dashboard,site,galerias,albuns,clientes,agenda,financeiro})[page]()}function dashboard(){const revenue=transactions.filter(t=>t.type==='entrada').reduce((s,t)=>s+Number(t.value),0);return head('Bom dia, Tabata!','Aqui está o que acontece no seu estúdio.')+`<div class="grid"><div class="card"><div class="label">Clientes cadastrados</div><div class="metric">${clients.length}</div><div class="label">No CRM</div></div><div class="card"><div class="label">Galerias criadas</div><div class="metric">${galleries.length}</div><div class="label">Projetos fotográficos</div></div><div class="card"><div class="label">Compromissos</div><div class="metric">${events.length}</div><div class="label">Na agenda</div></div><div class="card"><div class="label">Entradas registradas</div><div class="metric">${money(revenue)}</div><div class="label">Controle manual</div></div></div><div class="split"><div class="card"><h3 class="section-title">Galerias recentes</h3>${galleries.length?galleries.slice(-5).reverse().map(g=>`<div class="row"><div><strong>${esc(g.name)}</strong><small>${esc(g.client)}</small></div><button class="link" onclick="openGallery('${g.id}')">Abrir →</button></div>`).join(''):'<div class="empty">Suas galerias aparecerão aqui.</div>'}</div><div class="card"><h3 class="section-title">Comece por aqui</h3><div class="row"><strong>01 · Cadastre um cliente</strong><button class="link" onclick="setPage('clientes')">Abrir →</button></div><div class="row"><strong>02 · Crie uma galeria</strong><button class="link" onclick="setPage('galerias')">Abrir →</button></div><div class="row"><strong>03 · Monte um álbum</strong><button class="link" onclick="setPage('albuns')">Abrir →</button></div></div></div>`}function site(){return head('Meu site','Prévia da página pública da Tabata Fotografia.')+`<div class="notice">Esta é uma prévia de design. Publicação, domínio e formulário online serão conectados na versão de produção.</div><div class="preview"><div class="site-menu"><b>tabata <small>FOTOGRAFIA</small></b><span>Início &nbsp; Portfólio &nbsp; Sobre &nbsp; Serviços &nbsp; Contato</span></div><div class="hero"><div class="eyebrow">HISTÓRIAS QUE MERECEM SER LEMBRADAS</div><h2>Fotografias que<br>guardam sentimentos.</h2><p class="muted">Momentos autênticos, memórias para sempre.</p><button class="btn" onclick="alert('Formulário de orçamento será ativado na versão online.')">Solicitar orçamento</button></div><div class="site-foot">TABATA FOTOGRAFIA · Portfólio · Galeria do cliente · Contato</div></div>`}function galerias(){if(currentGallery)return galleryDetail();return head('Galerias','Organize os ensaios e prepare a entrega de fotografias.')+`<div class="card"><h3 class="section-title">Nova galeria</h3><form class="form" onsubmit="addGallery(event)"><input name="name" placeholder="Nome do ensaio" required maxlength="100"><input name="client" placeholder="Nome do cliente" required maxlength="100"><button class="btn">Criar galeria</button></form></div><br><div class="gallery-grid">${galleries.map(g=>`<div class="card gallery"><div class="gallery-cover">▧</div><div class="gallery-info"><h3>${esc(g.name)}</h3><p>${esc(g.client)} · ${g.count||0} foto(s)</p><button class="link" onclick="openGallery('${g.id}')">Gerenciar galeria →</button></div></div>`).join('')||'<div class="empty">Nenhuma galeria criada.</div>'}</div>`}function addGallery(e){e.preventDefault();const f=new FormData(e.target);galleries.push({id:String(Date.now()),name:f.get('name'),client:f.get('client'),count:0});save();render()}function openGallery(id){page='galerias';currentGallery=id;render()}function galleryDetail(){let g=galleries.find(x=>x.id===currentGallery);if(!g){currentGallery=null;return galerias()}let list=photos[g.id]||[];return head(esc(g.name),`Cliente: ${esc(g.client)}`,`<button class="btn secondary" onclick="currentGallery=null;render()">← Voltar</button>`)+`<div class="notice">Fotos carregadas aqui ficam somente nesta sessão de navegador. Para entrega real e segura, será necessário integrar armazenamento na nuvem e autenticação.</div><div class="card"><h3 class="section-title">Adicionar fotos</h3><input type="file" accept="image/*" multiple onchange="addPhotos(event,'${g.id}')"><p class="muted">Prévia local de imagens JPG, PNG e WebP.</p></div><br><div class="photo-grid">${list.map((src,i)=>`<div class="photo"><img src="${src}" alt="Foto ${i+1}"><button onclick="removePhoto('${g.id}',${i})">✕</button></div>`).join('')||'<div class="empty">Adicione imagens para visualizar a galeria.</div>'}</div>`}function addPhotos(e,id){const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));let pending=files.length;if(!pending)return;photos[id]??=[];files.forEach(f=>{const r=new FileReader();r.onload=()=>{photos[id].push(r.result);galleries.find(g=>g.id===id).count=photos[id].length;pending--;if(!pending){save();render()}};r.readAsDataURL(f)})}function removePhoto(id,i){photos[id].splice(i,1);galleries.find(g=>g.id===id).count=photos[id].length;save();render()}function clientes(){return head('Clientes / CRM','Cadastre e acompanhe os contatos do estúdio.')+`<div class="card"><h3 class="section-title">Novo cliente</h3><form class="form" onsubmit="addClient(event)"><input name="name" placeholder="Nome completo" required><input name="phone" placeholder="WhatsApp"><input name="email" type="email" placeholder="E-mail"><select name="status"><option>Novo contato</option><option>Orçamento enviado</option><option>Negociação</option><option>Contrato fechado</option><option>Entregue</option></select><button class="btn">Cadastrar</button></form></div><br><div class="card"><h3 class="section-title">Seus clientes</h3>${clients.map(c=>`<div class="row"><div><strong>${esc(c.name)}</strong><small>${esc(c.phone)} · ${esc(c.email)}</small></div><span class="tag">${esc(c.status)}</span></div>`).join('')||'<div class="empty">Nenhum cliente cadastrado ainda.</div>'}</div>`}function addClient(e){e.preventDefault();clients.push(Object.fromEntries(new FormData(e.target)));save();render()}function agenda(){return head('Agenda','Registre ensaios, reuniões e entregas.')+`<div class="card"><h3 class="section-title">Novo compromisso</h3><form class="form" onsubmit="addEvent(event)"><input name="name" placeholder="Descrição do compromisso" required><input name="date" type="datetime-local" required><button class="btn">Agendar</button></form></div><br><div class="card"><h3 class="section-title">Compromissos</h3>${events.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="row"><strong>${esc(e.name)}</strong><span class="tag">${new Date(e.date).toLocaleString('pt-BR')}</span></div>`).join('')||'<div class="empty">Agenda vazia.</div>'}</div>`}function addEvent(e){e.preventDefault();events.push(Object.fromEntries(new FormData(e.target)));save();render()}function financeiro(){let total=transactions.reduce((s,t)=>s+(t.type==='entrada'?1:-1)*Number(t.value),0);return head('Financeiro','Registre entradas e despesas do estúdio.')+`<div class="grid" style="grid-template-columns:1fr"><div class="card"><div class="label">Saldo registrado</div><div class="metric">${money(total)}</div></div></div><br><div class="card"><h3 class="section-title">Novo lançamento</h3><form class="form" onsubmit="addTransaction(event)"><input name="name" placeholder="Descrição" required><input name="value" type="number" step="0.01" min="0.01" placeholder="Valor (R$)" required><select name="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select><button class="btn">Registrar</button></form></div><br><div class="card"><h3 class="section-title">Lançamentos</h3>${transactions.map(t=>`<div class="row"><strong>${esc(t.name)}</strong><span class="tag">${t.type==='entrada'?'+':'−'} ${money(t.value)}</span></div>`).join('')||'<div class="empty">Nenhum lançamento registrado.</div>'}</div>`}function addTransaction(e){e.preventDefault();transactions.push(Object.fromEntries(new FormData(e.target)));save();render()}function albuns(){return head('Diagramador de álbuns','Primeiro editor experimental de páginas duplas.')+`<div class="notice">Protótipo de layout: permite colocar fotos nos quadros e adicionar páginas visuais. Ainda não oferece régua, sangria, exportação gráfica nem salvamento de projetos; esses recursos exigem o editor de produção.</div><div class="album-work"><div class="card"><h3 class="section-title">Ferramentas</h3><p class="label">Formato de demonstração: página dupla</p><button class="btn secondary" onclick="albumSlots+=2;render()">+ Adicionar quadros</button><p class="muted" style="font-size:12px">Clique em um quadro para inserir uma foto do computador.</p><input type="file" id="albumFile" accept="image/*" style="display:none" onchange="placeAlbumPhoto(event)"></div><div><div class="album-page" id="albumPage"><div class="album-half">${Array.from({length:Math.ceil(albumSlots/2)},(_,i)=>`<div class="album-slot" onclick="chooseAlbumSlot(${i})" id="slot-${i}">+ Foto</div>`).join('')}</div><div class="album-half">${Array.from({length:Math.floor(albumSlots/2)},(_,i)=>`<div class="album-slot" onclick="chooseAlbumSlot(${i+Math.ceil(albumSlots/2)})" id="slot-${i+Math.ceil(albumSlots/2)}">+ Foto</div>`).join('')}</div></div><p class="muted" style="text-align:center;font-size:12px">Página esquerda &nbsp; | &nbsp; Página direita</p></div></div>`}let selectedAlbumSlot=0;function chooseAlbumSlot(i){selectedAlbumSlot=i;document.getElementById('albumFile').click()}function placeAlbumPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let slot=document.getElementById('slot-'+selectedAlbumSlot);if(slot)slot.innerHTML=`<img src="${r.result}" alt="Foto do álbum">`};r.readAsDataURL(f)}render();
</script></body></html>
