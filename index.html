<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabata Fotografia | Studio</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#202733;--muted:#77808d;--line:#e5e9ef;--accent:#4868df;--side:#1d2430;--green:#167b58}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit}.shell{display:flex;min-height:100vh}.side{width:244px;background:var(--side);color:#e2e8f0;padding:24px 14px;flex-shrink:0}.logo{font-size:21px;font-weight:800;padding:4px 12px 25px;letter-spacing:-.6px}.logo small{display:block;color:#9caac0;font-size:11px;font-weight:500;letter-spacing:2px}.nav{width:100%;border:0;background:transparent;color:#b9c5d6;text-align:left;padding:12px 14px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:#343f52;color:white}.main{flex:1;min-width:0;padding:28px;max-width:1550px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{font-size:26px;letter-spacing:-.7px;margin:0}.sub{color:var(--muted);margin:3px 0 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 9px #20273306}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stat b{display:block;font-size:28px;margin-top:7px}.muted{color:var(--muted)}.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:10px 15px;border-radius:9px;font-weight:600}.btn.secondary{background:white;color:var(--ink);border-color:#d6dce6}.btn.danger{background:#fff1f1;color:#b52f39;border-color:#f5c6c9}.btn.small{padding:6px 10px;font-size:12px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:15px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-weight:600}.field input,.field select,.field textarea,input[type=search]{width:100%;padding:10px 12px;border:1px solid #d8dee8;border-radius:9px;background:#fff;min-width:0}.field textarea{min-height:90px;resize:vertical}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}.pill{display:inline-block;background:#edf1ff;color:#435bd0;border-radius:99px;padding:3px 9px;font-size:12px}.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #d7dde7;border-radius:12px}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.photo{position:relative;aspect-ratio:4/3;background:#e7eaf0;border-radius:10px;overflow:hidden;border:3px solid transparent}.photo.selected{border-color:var(--accent)}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .badge{position:absolute;top:7px;left:7px;background:#ffffffed;padding:3px 7px;border-radius:7px;font-size:12px}.photo .controls{position:absolute;bottom:6px;left:6px;right:6px;display:flex;justify-content:space-between}.photo button{border:0;background:#fffffff0;border-radius:7px;padding:5px 8px}.cover{height:145px;background:linear-gradient(130deg,#d9dfec,#f2e9e7);border-radius:12px;display:grid;place-items:center;color:#63728c;font-size:42px;margin-bottom:12px}.album-page{width:min(100%,720px);aspect-ratio:2/1;background:white;border:1px solid #cbd2dd;box-shadow:0 6px 22px #0001;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:15px;position:relative}.album-page:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #aab3c0;pointer-events:none}.album-slot{border:1px dashed #b7c0cf;background:#f4f6fa;display:grid;place-items:center;overflow:hidden;position:relative;color:#9ba5b5;text-align:center;min-width:0}.album-slot img{width:100%;height:100%;object-fit:cover}.album-slot button{position:absolute;top:4px;right:4px;background:#fff;border:0;border-radius:5px}.album-layout-3{grid-template-columns:1fr 1fr}.album-layout-3 .album-slot:first-child{grid-row:span 2}.album-layout-4{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr}.album-layout-1{grid-template-columns:1fr}.notice{background:#fff8e8;border:1px solid #f0dba9;color:#806019;padding:12px;border-radius:10px}.toast{position:fixed;bottom:22px;right:22px;background:#202733;color:white;padding:13px 18px;border-radius:10px;z-index:30;box-shadow:0 8px 25px #0002;max-width:360px}.modalback{position:fixed;inset:0;background:#11182799;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(100%,530px);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:22px}.hide{display:none!important}.menu-toggle{display:none}.sitehero{padding:65px 24px;text-align:center;background:linear-gradient(120deg,#e9e4df,#f8f7f5);border-radius:14px}.sitehero h2{font-family:Georgia,serif;font-size:42px;margin:10px}.sitehero p{color:#7c756e}.sitehero button{margin-top:12px}.footnote{font-size:12px;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.side{position:fixed;z-index:10;inset:0 auto 0 0;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.menu-toggle{display:inline-block}.main{padding:17px}.top h1{font-size:22px}.two,.three{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}.album-page{padding:6px;gap:4px}.top{align-items:flex-start}}@media print{.side,.top,.no-print,.notice{display:none!important}.main{padding:0}.card{border:0;box-shadow:none}.album-page{width:100%;box-shadow:none;break-inside:avoid}}
</style></head><body><div class="shell"><aside class="side" id="sidebar"><div class="logo">Tabata <span style="font-weight:400">Fotografia</span><small>STUDIO MANAGER</small></div><nav id="navigation"></nav><p style="padding:18px 12px;color:#9caac0;font-size:12px">Versão local • demonstração<br>Dados salvos neste navegador</p></aside><main class="main"><header class="top"><div class="row"><button class="btn secondary menu-toggle" id="toggle">☰</button><div><h1 id="title">Dashboard</h1><p class="sub" id="subtitle">Gestão do seu estúdio</p></div></div><span class="pill">Tabata Fotografia</span></header><div id="content"></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const KEY='tabata_studio_v4';
const defaults=()=>({clients:[],galleries:[],events:[],transactions:[],albums:[],settings:{studio:'Tabata Fotografia',whatsapp:'',bio:'Fotografias que contam histórias.'}});
let db;try{db=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'));for(const k of ['clients','galleries','events','transactions','albums'])if(!Array.isArray(db[k]))db[k]=[];db.settings=Object.assign(defaults().settings,db.settings||{});}catch(e){db=defaults();}
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Armazenamento cheio. Exporte um backup e reduza as imagens.');return false}}
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',3500)}
const sections=[['dashboard','▦','Dashboard'],['site','◈','Meu site'],['clients','♙','Clientes / CRM'],['galleries','▧','Galerias'],['albums','▤','Diagramador'],['events','▣','Agenda'],['finance','＄','Financeiro'],['settings','⚙','Configurações']];let view='dashboard',currentGallery=null,currentAlbum=null,clientMode=false;
function navigate(v){view=v;clientMode=false;$('#sidebar').classList.remove('open');render()}
function render(){let s=sections.find(x=>x[0]===view)||sections[0];$('#title').textContent=s[2];$('#subtitle').textContent=view==='galleries'?'Entrega, seleção e venda de fotos':'Painel de gestão do estúdio';$('#navigation').innerHTML=sections.map(x=>`<button class="nav ${view===x[0]?'active':''}" data-nav="${x[0]}">${x[1]} &nbsp;${x[2]}</button>`).join('');$('#content').innerHTML=({dashboard,site,clients,galleries,albums,events,finance,settings}[view]||dashboard)();bind();}
function action(text,act,style=''){return `<button class="btn ${style}" data-action="${act}">${text}</button>`}
function dashboard(){let received=db.transactions.filter(t=>t.type==='entrada').reduce((a,t)=>a+Number(t.value),0),spent=db.transactions.filter(t=>t.type==='saida').reduce((a,t)=>a+Number(t.value),0);return `<div class="grid"><div class="card stat"><span class="muted">Clientes</span><b>${db.clients.length}</b></div><div class="card stat"><span class="muted">Galerias</span><b>${db.galleries.length}</b></div><div class="card stat"><span class="muted">Álbuns</span><b>${db.albums.length}</b></div><div class="card stat"><span class="muted">Saldo registrado</span><b>${money(received-spent)}</b></div></div><div class="two" style="margin-top:18px"><div class="card"><h3>Acesso rápido</h3><div class="row">${action('Nova galeria','newGallery')}${action('Novo cliente','newClient','secondary')}${action('Novo álbum','newAlbum','secondary')}</div></div><div class="card"><h3>Próximos compromissos</h3>${db.events.filter(e=>e.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<p>📅 ${dateBR(e.date)} — ${esc(e.title)}</p>`).join('')||'<p class="muted">Nenhum compromisso futuro.</p>'}</div></div><p class="notice" style="margin-top:18px">Este protótipo funciona no navegador. O GitHub Pages não sincroniza fotos, clientes ou seleções entre dispositivos. Não use dados sensíveis de clientes nesta demonstração.</p>`}
function site(){return `<div class="card"><div class="row between"><h3>Prévia do site</h3><span class="pill">Demonstração</span></div><div class="sitehero"><small>ESTÚDIO DE FOTOGRAFIA</small><h2>${esc(db.settings.studio)}</h2><p>${esc(db.settings.bio)}</p><button class="btn secondary" data-action="siteContact">Solicitar orçamento</button></div><div class="three" style="margin-top:18px"><div class="cover">♡</div><div class="cover">✦</div><div class="cover">◈</div></div><p class="muted">Personalize o nome, a descrição e o WhatsApp em Configurações. O portfólio público definitivo exigirá publicação e armazenamento online.</p></div>`}
function clients(){return `<div class="card"><div class="row between"><h3>Clientes (${db.clients.length})</h3>${action('+ Novo cliente','newClient')}</div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Contato</th><th>Observações</th><th>Ações</th></tr></thead><tbody>${db.clients.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}<br>${esc(c.email)}</td><td>${esc(c.notes)}</td><td>${action('Editar','editClient:'+c.id,'small secondary')} ${action('Excluir','deleteClient:'+c.id,'small danger')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum cliente cadastrado.</td></tr>'}</tbody></table></div></div>`}
function galleries(){if(currentGallery){let g=db.galleries.find(x=>x.id===currentGallery);if(!g){currentGallery=null;return galleries()}return galleryDetail(g)}return `<div class="row between" style="margin-bottom:15px"><p class="muted">Organize ensaios e configure o pacote de fotos.</p>${action('+ Criar galeria','newGallery')}</div><div class="three">${db.galleries.map(g=>`<div class="card"><div class="cover">📷</div><h3>${esc(g.name)}</h3><p class="muted">${esc(g.client||'Sem cliente')} · ${g.photos.length} fotos</p><p><span class="pill">${Number(g.included)} incluídas</span> · Extra ${money(g.price)}</p><div class="row">${action('Abrir','openGallery:'+g.id,'small')}${action('Excluir','deleteGallery:'+g.id,'small danger')}</div></div>`).join('')||'<div class="empty">Nenhuma galeria ainda. Clique em Criar galeria.</div>'}</div>`}
function galleryDetail(g){let selected=g.photos.filter(p=>p.selected).length,extras=Math.max(0,selected-Number(g.included)),total=extras*Number(g.price);return `<div class="row between no-print" style="margin-bottom:15px">${action('← Voltar','backGalleries','secondary')}<div class="row">${action('Editar pacote','editGallery:'+g.id,'secondary')}${action('Visualizar como cliente','clientPreview:'+g.id,'secondary')}${action('Apagar galeria','deleteGallery:'+g.id,'danger')}</div></div><div class="card"><h2>${esc(g.name)}</h2><p class="muted">${esc(g.client||'Sem cliente')} · ${g.photos.length} fotografias</p><div class="grid" style="margin-bottom:18px"><div class="card stat"><span class="muted">Selecionadas</span><b>${selected}</b></div><div class="card stat"><span class="muted">Incluídas</span><b>${g.included}</b></div><div class="card stat"><span class="muted">Extras</span><b>${extras}</b></div><div class="card stat"><span class="muted">Total extras</span><b>${money(total)}</b></div></div><div class="row no-print" style="margin-bottom:18px"><label class="btn secondary">+ Adicionar fotos<input type="file" id="uploadPhotos" accept="image/*" multiple hidden></label>${action('Limpar seleção','clearSelection:'+g.id,'secondary')}${action('Resumo da seleção','summary:'+g.id)}</div><div class="thumbs">${g.photos.map((p,i)=>`<div class="photo ${p.selected?'selected':''}"><img src="${p.data}" alt="Foto ${i+1}"><span class="badge">${p.selected?'♥ Selecionada':'Foto '+(i+1)}</span><div class="controls"><button data-action="selectPhoto:${g.id}:${p.id}">${p.selected?'Desmarcar':'♡ Selecionar'}</button><button data-action="deletePhoto:${g.id}:${p.id}" title="Remover">✕</button></div></div>`).join('')||'<div class="empty">Adicione fotografias para começar.</div>'}</div><p class="footnote" style="margin-top:15px">As fotos são reduzidas para pré-visualização e armazenadas apenas neste navegador. Não substituem arquivos originais nem armazenamento em nuvem.</p></div>`}
function albums(){if(currentAlbum){let a=db.albums.find(x=>x.id===currentAlbum);if(!a){currentAlbum=null;return albums()}return albumDetail(a)}return `<div class="row between" style="margin-bottom:15px"><p class="muted">Editor experimental de páginas duplas.</p>${action('+ Criar álbum','newAlbum')}</div><div class="three">${db.albums.map(a=>`<div class="card"><div class="cover">▤</div><h3>${esc(a.name)}</h3><p class="muted">${a.pages.length} páginas duplas · ${esc(a.size)}</p><div class="row">${action('Editar','openAlbum:'+a.id,'small')}${action('Excluir','deleteAlbum:'+a.id,'small danger')}</div></div>`).join('')||'<div class="empty">Nenhum álbum criado.</div>'}</div>`}
function albumDetail(a){let p=a.pages[a.pageIndex||0];return `<div class="row between no-print" style="margin-bottom:15px">${action('← Álbuns','backAlbums','secondary')}<div class="row">${action('+ Página dupla','addPage:'+a.id)}${action('Imprimir / salvar PDF','printAlbum','secondary')}</div></div><div class="card"><h2>${esc(a.name)}</h2><p class="muted">Formato: ${esc(a.size)} · Página dupla ${Number(a.pageIndex||0)+1} de ${a.pages.length}</p><div class="row no-print" style="margin-bottom:16px"><label>Layout: <select id="albumLayout"><option value="1" ${p.layout==='1'?'selected':''}>1 foto</option><option value="2" ${p.layout==='2'?'selected':''}>2 fotos</option><option value="3" ${p.layout==='3'?'selected':''}>3 fotos</option><option value="4" ${p.layout==='4'?'selected':''}>4 fotos</option></select></label><label>Adicionar foto <input id="albumUpload" type="file" accept="image/*"></label></div><div class="album-page album-layout-${p.layout}">${Array.from({length:Number(p.layout)},(_,i)=>`<div class="album-slot">${p.images[i]?`<img src="${p.images[i]}" alt="Foto do álbum"><button data-action="removeAlbumPhoto:${a.id}:${i}">✕</button>`:`<span>Espaço ${i+1}<br><small>Selecione a posição abaixo</small></span>`}</div>`).join('')}</div><div class="row no-print" style="justify-content:center;margin-top:15px"><button class="btn secondary" data-action="prevPage:${a.id}" ${a.pageIndex===0?'disabled':''}>← Anterior</button><button class="btn secondary" data-action="nextPage:${a.id}" ${a.pageIndex===a.pages.length-1?'disabled':''}>Próxima →</button>${action('Excluir página','deletePage:'+a.id,'danger')}</div><p class="footnote">Para inserir uma foto, selecione o espaço desejado abaixo e depois escolha o arquivo. Exportação via impressão do navegador é apenas prévia, não PDF técnico para laboratório.</p><div class="row no-print"><label>Posição <select id="albumSlot">${Array.from({length:Number(p.layout)},(_,i)=>`<option value="${i}">${i+1}</option>`).join('')}</select></label></div></div>`}
function events(){return `<div class="card"><div class="row between"><h3>Agenda</h3>${action('+ Compromisso','newEvent')}</div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Compromisso</th><th>Detalhes</th><th></th></tr></thead><tbody>${db.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${dateBR(e.date)}</td><td>${esc(e.title)}</td><td>${esc(e.notes)}</td><td>${action('Excluir','deleteEvent:'+e.id,'small danger')}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Sem compromissos.</td></tr>'}</tbody></table></div></div>`}
function finance(){let income=db.transactions.filter(t=>t.type==='entrada').reduce((a,t)=>a+Number(t.value),0),out=db.transactions.filter(t=>t.type==='saida').reduce((a,t)=>a+Number(t.value),0);return `<div class="grid" style="margin-bottom:18px"><div class="card stat"><span class="muted">Entradas</span><b>${money(income)}</b></div><div class="card stat"><span class="muted">Saídas</span><b>${money(out)}</b></div><div class="card stat"><span class="muted">Saldo</span><b>${money(income-out)}</b></div></div><div class="card"><div class="row between"><h3>Lançamentos</h3>${action('+ Lançamento','newTransaction')}</div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${dateBR(t.date)}</td><td>${esc(t.name)}</td><td>${t.type==='entrada'?'Entrada':'Saída'}</td><td>${money(t.value)}</td><td>${action('Excluir','deleteTransaction:'+t.id,'small danger')}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Sem lançamentos.</td></tr>'}</tbody></table></div></div>`}
function settings(){return `<div class="two"><div class="card"><h3>Identidade do estúdio</h3><form id="settingsForm"><div class="field"><label>Nome</label><input name="studio" required value="${esc(db.settings.studio)}"></div><div class="field"><label>WhatsApp com DDD</label><input name="whatsapp" value="${esc(db.settings.whatsapp)}" placeholder="5511999999999"></div><div class="field"><label>Descrição</label><textarea name="bio">${esc(db.settings.bio)}</textarea></div><button class="btn">Salvar</button></form></div><div class="card"><h3>Backup e dados</h3><p class="muted">Exporte cadastros, galerias e configurações. Imagens não são incluídas no backup para evitar arquivos enormes.</p><div class="stack">${action('Exportar backup JSON','exportBackup','secondary')}<label class="btn secondary" style="text-align:center">Importar backup JSON<input id="importBackup" type="file" accept="application/json" hidden></label>${action('Apagar todos os dados locais','resetAll','danger')}</div></div></div>`}
function modal(title,fields,onSubmit){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="row between"><h2>${esc(title)}</h2><button class="btn secondary small" id="closeModal">✕</button></div><form id="modalForm">${fields}<div class="row" style="justify-content:flex-end"><button type="button" class="btn secondary" id="cancelModal">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form></div></div>`;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));onSubmit(data)}}
function closeModal(){$('#modalRoot').innerHTML=''}
const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label>${label}</label><input type="${type}" name="${name}" value="${esc(value)}" ${extra}></div>`;
function confirmDelete(label,fn){if(confirm(`Excluir ${label}? Esta ação não pode ser desfeita.`)){fn();save();render();toast('Excluído.')}}
function doAction(act){let [name,x,y]=act.split(':');if(name==='newClient'||name==='editClient'){let c=db.clients.find(v=>v.id===x)||{};modal('Cliente',field('Nome','name',c.name,'text','required')+field('Telefone','phone',c.phone,'tel')+field('E-mail','email',c.email,'email')+field('Observações','notes',c.notes),d=>{if(c.id)Object.assign(c,d);else db.clients.push({...d,id:id()});save();closeModal();render()})}
else if(name==='deleteClient')confirmDelete('cliente',()=>db.clients=db.clients.filter(v=>v.id!==x));
else if(name==='newGallery'||name==='editGallery'){let g=db.galleries.find(v=>v.id===x)||{};modal('Configurar galeria',field('Nome da galeria','name',g.name,'text','required')+field('Cliente','client',g.client)+field('Fotos incluídas','included',g.included??20,'number','min="0" required')+field('Preço de cada extra (R$)','price',g.price??15,'number','min="0" step="0.01" required'),d=>{d.included=Number(d.included);d.price=Number(d.price);if(g.id)Object.assign(g,d);else{g={...d,id:id(),photos:[]};db.galleries.push(g)}currentGallery=g.id;save();closeModal();render()})}
else if(name==='openGallery'){currentGallery=x;render()}else if(name==='backGalleries'){currentGallery=null;render()}else if(name==='deleteGallery')confirmDelete('galeria',()=>{db.galleries=db.galleries.filter(v=>v.id!==x);currentGallery=null});
else if(name==='selectPhoto'){let p=db.galleries.find(g=>g.id===x)?.photos.find(p=>p.id===y);if(p){p.selected=!p.selected;save();render()}}
else if(name==='deletePhoto')confirmDelete('foto',()=>{let g=db.galleries.find(g=>g.id===x);g.photos=g.photos.filter(p=>p.id!==y)});
else if(name==='clearSelection'){let g=db.galleries.find(g=>g.id===x);if(confirm('Limpar todas as seleções?')){g.photos.forEach(p=>p.selected=false);save();render()}}
else if(name==='summary'||name==='clientPreview'){let g=db.galleries.find(g=>g.id===x),s=g.photos.filter(p=>p.selected).length,extra=Math.max(0,s-g.included);alert(`${name==='clientPreview'?'PRÉVIA LOCAL DO CLIENTE\n\n':''}${g.name}\nFotos selecionadas: ${s}\nIncluídas: ${g.included}\nExtras: ${extra}\nTotal a pagar: ${money(extra*g.price)}\n\nPagamento online ainda não está integrado.`)}
else if(name==='newEvent')modal('Novo compromisso',field('Título','title','','text','required')+field('Data','date',new Date().toISOString().slice(0,10),'date','required')+field('Detalhes','notes'),d=>{db.events.push({...d,id:id()});save();closeModal();render()});
else if(name==='deleteEvent')confirmDelete('compromisso',()=>db.events=db.events.filter(e=>e.id!==x));
else if(name==='newTransaction')modal('Novo lançamento',field('Descrição','name','','text','required')+field('Data','date',new Date().toISOString().slice(0,10),'date','required')+'<div class="field"><label>Tipo</label><select name="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div>'+field('Valor (R$)','value','','number','required min="0.01" step="0.01"'),d=>{db.transactions.push({...d,id:id(),value:Number(d.value)});save();closeModal();render()});
else if(name==='deleteTransaction')confirmDelete('lançamento',()=>db.transactions=db.transactions.filter(t=>t.id!==x));
else if(name==='newAlbum')modal('Novo álbum',field('Nome','name','','text','required')+field('Tamanho (ex.: 30x30 cm)','size','30x30 cm','text','required'),d=>{let a={...d,id:id(),pageIndex:0,pages:[{layout:'2',images:[]}]};db.albums.push(a);currentAlbum=a.id;save();closeModal();render()});
else if(name==='openAlbum'){currentAlbum=x;render()}else if(name==='backAlbums'){currentAlbum=null;render()}else if(name==='deleteAlbum')confirmDelete('álbum',()=>{db.albums=db.albums.filter(a=>a.id!==x);currentAlbum=null});
else if(name==='addPage'){let a=db.albums.find(a=>a.id===x);a.pages.push({layout:'2',images:[]});a.pageIndex=a.pages.length-1;save();render()}
else if(name==='prevPage'||name==='nextPage'){let a=db.albums.find(a=>a.id===x);a.pageIndex+=name==='prevPage'?-1:1;save();render()}
else if(name==='deletePage'){let a=db.albums.find(a=>a.id===x);if(a.pages.length===1){toast('O álbum precisa ter ao menos uma página dupla.');return}confirmDelete('página',()=>{a.pages.splice(a.pageIndex,1);a.pageIndex=Math.max(0,a.pageIndex-1)})}
else if(name==='removeAlbumPhoto'){let a=db.albums.find(a=>a.id===x);a.pages[a.pageIndex].images[Number(y)]=null;save();render()}
else if(name==='printAlbum'){window.print()}
else if(name==='siteContact'){let digits=db.settings.whatsapp.replace(/\D/g,'');if(digits)window.open('https://wa.me/'+digits,'_blank','noopener');else toast('Configure o WhatsApp em Configurações.')}
else if(name==='exportBackup'){let copy=structuredClone(db);copy.galleries.forEach(g=>g.photos=[]);copy.albums.forEach(a=>a.pages.forEach(p=>p.images=[]));let blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tabata-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
else if(name==='resetAll'){if(confirm('Apagar TODOS os dados deste navegador?')&&confirm('Confirma a exclusão definitiva?')){db=defaults();currentAlbum=currentGallery=null;save();render()}}}
async function compress(file,max=1000,quality=.68){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let ratio=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*ratio));canvas.height=Math.max(1,Math.round(img.height*ratio));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',quality))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagem inválida'))};img.src=url})}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{currentGallery=null;currentAlbum=null;navigate(b.dataset.nav)});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>doAction(b.dataset.action));let upload=$('#uploadPhotos');if(upload)upload.onchange=async e=>{let g=db.galleries.find(g=>g.id===currentGallery),count=0;for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;try{let data=await compress(f,900,.6);g.photos.push({id:id(),data,selected:false});if(!save()){g.photos.pop();break}count++}catch(err){toast('Erro ao processar '+f.name)}}render();toast(count+' foto(s) adicionada(s).')};let form=$('#settingsForm');if(form)form.onsubmit=e=>{e.preventDefault();db.settings=Object.fromEntries(new FormData(form));save();render();toast('Configurações salvas.')};let imp=$('#importBackup');if(imp)imp.onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!['clients','galleries','events','transactions','albums'].every(k=>Array.isArray(d[k])))throw Error();if(confirm('Importar backup e substituir dados atuais?')){db=d;db.settings=Object.assign(defaults().settings,db.settings||{});currentGallery=currentAlbum=null;save();render();toast('Backup importado.')}}catch(err){toast('Arquivo de backup inválido.')}};let layout=$('#albumLayout');if(layout)layout.onchange=e=>{let a=db.albums.find(a=>a.id===currentAlbum);a.pages[a.pageIndex].layout=e.target.value;save();render()};let albumUp=$('#albumUpload');if(albumUp)albumUp.onchange=async e=>{let f=e.target.files[0];if(!f)return;let a=db.albums.find(a=>a.id===currentAlbum),slot=Number($('#albumSlot').value);try{a.pages[a.pageIndex].images[slot]=await compress(f,1300,.78);save();render()}catch(err){toast('Não foi possível abrir a imagem.')}}}
$('#toggle').onclick=()=>$('#sidebar').classList.toggle('open');render();
</script></body></html>
